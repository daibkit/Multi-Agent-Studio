/* ------------------------------------------------------------------ */
/* Hình học đường nối                                                  */
/* ------------------------------------------------------------------ */
function edgeGeom(a, b, offset) {
  const ax = a.x + W / 2, ay = a.y + H / 2, bx = b.x + W / 2, by = b.y + H / 2;
  const dx = bx - ax, dy = by - ay;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const cax = ax + nx * offset, cay = ay + ny * offset;
  const cbx = bx + nx * offset, cby = by + ny * offset;
  const border = (cx, cy, tx, ty) => {
    const ddx = tx - cx, ddy = ty - cy;
    const sx = ddx === 0 ? Infinity : (W / 2 + 4) / Math.abs(ddx);
    const sy = ddy === 0 ? Infinity : (H / 2 + 4) / Math.abs(ddy);
    const s = Math.min(sx, sy);
    return [cx + ddx * s, cy + ddy * s];
  };
  const [x1, y1] = border(cax, cay, cbx, cby);
  const [x2, y2] = border(cbx, cby, cax, cay);
  return { x1, y1, x2, y2, ux: dx / len, uy: dy / len };
}

/* ------------------------------------------------------------------ */
/* Node card                                                           */
/* ------------------------------------------------------------------ */
function NodeCard({ node, status, selected, onPointerDown }) {
  const c = node.color;
  let shadow = "none";
  if (status === "thinking") shadow = `0 0 0 1px ${c}, 0 0 32px ${c}66`;
  else if (status === "done") shadow = `0 0 0 1px #34d39966, 0 0 18px #34d39922`;
  else if (selected) shadow = `0 0 0 1px ${c}, 0 0 18px ${c}33`;
  return (
    <div
      onPointerDown={onPointerDown}
      style={{ left: node.x, top: node.y, width: W, height: H, boxShadow: shadow, touchAction: "none", borderColor: selected || status === "thinking" ? c : undefined }}
      className={"absolute rounded-xl border bg-slate-900/80 backdrop-blur-sm select-none cursor-grab active:cursor-grabbing overflow-hidden transition-shadow " +
        (selected || status === "thinking" ? "" : status === "done" ? "border-emerald-500/40" : "border-slate-800 hover:border-slate-700")}
    >
      <div style={{ height: 3, background: c, opacity: status === "idle" ? 0.5 : 1 }} className={status === "thinking" ? "pulse-glow" : ""} />
      <div className="px-3 pt-2.5">
        <div className="flex items-center gap-2">
          <div className="flex items-center justify-center rounded-lg shrink-0" style={{ width: 28, height: 28, background: c + "22", color: c }}>
            <Icon name={node.icon} size={15} />
          </div>
          <div className="min-w-0 flex-1 text-[13px] font-semibold text-slate-100 leading-tight truncate" title={node.name}>{node.name}</div>
          <div className="shrink-0">
            {status === "thinking" && <span className="block w-3.5 h-3.5 rounded-full border-2 border-t-transparent spin" style={{ borderColor: c, borderTopColor: "transparent" }} />}
            {status === "done" && <Icon name="check" size={15} className="text-emerald-400" />}
          </div>
        </div>
        <div className="mt-1.5 text-[11px] leading-snug text-slate-400"
          style={{ display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>
          {node.role}
        </div>
      </div>
      <div className="absolute left-3 right-3 bottom-2 flex items-center justify-between gap-2">
        <span className="truncate rounded px-1.5 py-0.5 text-[10px] font-medium border" style={{ color: c, borderColor: c + "44", background: c + "11" }}>{node.model}</span>
        <span className="shrink-0 flex items-center gap-1 text-[10px] text-slate-500"><Icon name="wrench" size={10} />{node.tools.length}</span>
      </div>
    </div>
  );
}

function Inspector({ node, nodes, edges, status, onUpdate, onDelete, onAddEdge, onRemoveEdge }) {
  const [toolText, setToolText] = useState("");
  const [target, setTarget] = useState("");
  const [edgeLabel, setEdgeLabel] = useState("");
  const outgoing = edges.filter(e => e.from === node.id);
  const incoming = edges.filter(e => e.to === node.id);
  const nameOf = id => (nodes.find(n => n.id === id) || { name: "?" }).name;
  const candidates = nodes.filter(n => n.id !== node.id && !outgoing.some(e => e.to === n.id));

  const addTool = () => {
    const t = toolText.trim();
    if (!t || node.tools.includes(t)) { setToolText(""); return; }
    onUpdate(node.id, { tools: [...node.tools, t] });
    setToolText("");
  };

  return (
    <div className="p-4 space-y-5">
      <div className="flex items-center gap-3">
        <div className="flex items-center justify-center rounded-xl" style={{ width: 40, height: 40, background: node.color + "22", color: node.color }}>
          <Icon name={node.icon} size={20} />
        </div>
        <div className="min-w-0 flex-1">
          <div className="text-sm font-semibold text-slate-100 truncate">{node.name}</div>
          <div className="text-[11px] text-slate-500">ID: {node.id}</div>
        </div>
        <span className="rounded-full px-2 py-0.5 text-[10px] font-medium border"
          style={{
            color: status === "done" ? "#34d399" : status === "thinking" ? node.color : "#64748b",
            borderColor: status === "done" ? "#34d39955" : status === "thinking" ? node.color + "66" : "#1e293b",
          }}>{STATUS_LABEL[status]}</span>
      </div>

      <div>
        <label className={labelCls}>Tên Agent</label>
        <input className={inputCls} value={node.name} onChange={e => onUpdate(node.id, { name: e.target.value })} />
      </div>
      <div>
        <label className={labelCls}>Vai trò</label>
        <textarea rows={3} className={inputCls + " resize-none"} value={node.role} onChange={e => onUpdate(node.id, { role: e.target.value })} />
      </div>
      <div>
        <label className={labelCls}>Model</label>
        <input className={inputCls} value={node.model} onChange={e => onUpdate(node.id, { model: e.target.value })} />
      </div>
      <div>
        <label className={labelCls}>Màu sắc</label>
        <div className="flex flex-wrap gap-2">
          {PALETTE.map(c => (
            <button key={c} onClick={() => onUpdate(node.id, { color: c })} title={c}
              className="rounded-full transition-transform hover:scale-110"
              style={{ width: 22, height: 22, background: c, outline: node.color === c ? "2px solid #e2e8f0" : "none", outlineOffset: 2 }} />
          ))}
        </div>
      </div>
      <div>
        <label className={labelCls}>System Prompt (tóm tắt)</label>
        <textarea rows={5} className={inputCls + " resize-none leading-relaxed"} value={node.prompt} onChange={e => onUpdate(node.id, { prompt: e.target.value })} />
      </div>

      <div>
        <label className={labelCls}>Tools ({node.tools.length})</label>
        <div className="flex flex-wrap gap-1.5 mb-2">
          {node.tools.map(t => (
            <span key={t} className="inline-flex items-center gap-1 rounded-md border px-2 py-1 text-[11px]" style={{ color: node.color, borderColor: node.color + "44", background: node.color + "11" }}>
              <Icon name="wrench" size={10} />{t}
              <button onClick={() => onUpdate(node.id, { tools: node.tools.filter(x => x !== t) })} className="opacity-60 hover:opacity-100"><Icon name="x" size={11} /></button>
            </span>
          ))}
          {node.tools.length === 0 && <span className="text-xs text-slate-600">Chưa có tool.</span>}
        </div>
        <div className="flex gap-2">
          <input className={inputCls} placeholder="Thêm tool rồi nhấn Enter" value={toolText}
            onChange={e => setToolText(e.target.value)} onKeyDown={e => { if (e.key === "Enter") addTool(); }} />
          <button onClick={addTool} className="rounded-md border border-slate-800 bg-slate-950 px-2.5 text-slate-300 hover:border-slate-600"><Icon name="plus" size={14} /></button>
        </div>
      </div>

      <div>
        <label className={labelCls}>Input schema</label>
        <textarea rows={2} className={inputCls + " resize-none font-mono text-xs"} value={node.input} onChange={e => onUpdate(node.id, { input: e.target.value })} />
      </div>
      <div>
        <label className={labelCls}>Output schema</label>
        <textarea rows={2} className={inputCls + " resize-none font-mono text-xs"} value={node.output} onChange={e => onUpdate(node.id, { output: e.target.value })} />
      </div>

      <div>
        <label className={labelCls}>Kết nối (Data flow)</label>
        <div className="space-y-1.5">
          {incoming.map(e => (
            <div key={e.id} className="flex items-center gap-2 rounded-md bg-slate-950 border border-slate-800 px-2 py-1.5 text-xs">
              <span className="text-slate-500">Vào ←</span>
              <span className="flex-1 truncate text-slate-300">{nameOf(e.from)} <span className="text-slate-600">· {e.label}</span></span>
              <button onClick={() => onRemoveEdge(e.id)} className="text-slate-600 hover:text-rose-400"><Icon name="x" size={12} /></button>
            </div>
          ))}
          {outgoing.map(e => (
            <div key={e.id} className="flex items-center gap-2 rounded-md bg-slate-950 border border-slate-800 px-2 py-1.5 text-xs">
              <span className="text-slate-500">Ra →</span>
              <span className="flex-1 truncate text-slate-300">{nameOf(e.to)} <span className="text-slate-600">· {e.label}</span></span>
              <button onClick={() => onRemoveEdge(e.id)} className="text-slate-600 hover:text-rose-400"><Icon name="x" size={12} /></button>
            </div>
          ))}
        </div>
        {candidates.length > 0 && (
          <div className="mt-2 space-y-2">
            <select className={inputCls} value={target} onChange={e => setTarget(e.target.value)}>
              <option value="">Nối tới node…</option>
              {candidates.map(n => <option key={n.id} value={n.id}>{n.name}</option>)}
            </select>
            <div className="flex gap-2">
              <input className={inputCls} placeholder="Nhãn (VD: Handoff)" value={edgeLabel} onChange={e => setEdgeLabel(e.target.value)} />
              <button disabled={!target}
                onClick={() => { onAddEdge(node.id, target, edgeLabel.trim() || "Handoff"); setTarget(""); setEdgeLabel(""); }}
                className="shrink-0 inline-flex items-center gap-1 rounded-md border border-slate-700 bg-slate-800 px-3 text-xs text-slate-200 hover:bg-slate-700 disabled:opacity-40">
                <Icon name="link" size={12} />Nối
              </button>
            </div>
          </div>
        )}
      </div>

      <button onClick={() => onDelete(node.id)}
        className="w-full inline-flex items-center justify-center gap-2 rounded-md border border-rose-900/60 bg-rose-950/30 py-2 text-xs text-rose-300 hover:bg-rose-950/60">
        <Icon name="trash" size={13} />Xóa node này
      </button>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Modal Export                                                        */
/* ------------------------------------------------------------------ */
function ExportModal({ nodes, edges, onClose }) {
  const [tab, setTab] = useState("json");
  const [copied, setCopied] = useState(false);
  const taRef = useRef(null);

  const json = useMemo(() => JSON.stringify({ nodes, edges }, null, 2), [nodes, edges]);
  const mermaid = useMemo(() => {
    const sid = id => "n_" + String(id).replace(/[^A-Za-z0-9_]/g, "_");
    const esc = s => String(s).replace(/"/g, "'");
    const lines = ["flowchart LR"];
    nodes.forEach(n => lines.push(`  ${sid(n.id)}["${esc(n.name)}<br/>(${esc(n.model)})"]`));
    edges.forEach(e => lines.push(`  ${sid(e.from)} -->|"${esc(e.label)}"| ${sid(e.to)}`));
    nodes.forEach(n => lines.push(`  style ${sid(n.id)} fill:${n.color}33,stroke:${n.color},color:#e2e8f0`));
    return lines.join("\n");
  }, [nodes, edges]);

  const text = tab === "json" ? json : mermaid;
  const copy = async () => {
    let done = false;
    try { await navigator.clipboard.writeText(text); done = true; } catch (e) { /* fallback */ }
    if (!done) {
      try { taRef.current.focus(); taRef.current.select(); done = document.execCommand("copy"); } catch (e) { done = false; }
    }
    setCopied(done ? "ok" : "fail");
    setTimeout(() => setCopied(false), 1800);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4" onPointerDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="flex w-full max-w-2xl flex-col rounded-xl border border-slate-800 bg-slate-900 shadow-2xl" style={{ maxHeight: "85vh" }}>
        <div className="flex items-center justify-between border-b border-slate-800 px-4 py-3">
          <div className="flex items-center gap-1 rounded-lg bg-slate-950 p-1 border border-slate-800">
            {[["json", "JSON"], ["mermaid", "Mermaid"]].map(([k, l]) => (
              <button key={k} onClick={() => setTab(k)} className={"rounded-md px-3 py-1 text-xs font-medium " + (tab === k ? "bg-slate-800 text-slate-100" : "text-slate-500 hover:text-slate-300")}>{l}</button>
            ))}
          </div>
          <button onClick={onClose} className="text-slate-500 hover:text-slate-200"><Icon name="x" size={16} /></button>
        </div>
        <div className="p-4 flex-1 min-h-0">
          <textarea ref={taRef} readOnly value={text} onFocus={e => e.target.select()}
            className="h-[48vh] w-full resize-none rounded-md border border-slate-800 bg-slate-950 p-3 font-mono text-xs text-slate-300 focus:outline-none scroll-thin" />
          {tab === "mermaid" && <p className="mt-2 text-[11px] text-slate-500">Dán vào khối <code className="text-slate-400">```mermaid</code> trong Notion, Markdown hoặc GitHub để hiển thị sơ đồ.</p>}
        </div>
        <div className="flex items-center justify-end gap-3 border-t border-slate-800 px-4 py-3">
          {copied === "ok" && <span className="text-xs text-emerald-400">Đã copy!</span>}
          {copied === "fail" && <span className="text-xs text-amber-400">Không copy tự động được. Hãy bấm vào ô và nhấn Ctrl/Cmd+C.</span>}
          <button onClick={copy} className="inline-flex items-center gap-2 rounded-md bg-slate-100 px-3 py-1.5 text-sm font-medium text-slate-900 hover:bg-white"><Icon name="copy" size={14} />Copy {tab === "json" ? "JSON" : "Mermaid"}</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [nodes, setNodes] = useState(INITIAL_NODES);
  const [edges, setEdges] = useState(INITIAL_EDGES);
  const [selected, setSelected] = useState("orch");
  const [scenarioId, setScenarioId] = useState("build");
  const [speed, setSpeed] = useState(1);
  const [running, setRunning] = useState(false);
  const [statuses, setStatuses] = useState({});
  const [edgeStates, setEdgeStates] = useState({});
  const [logs, setLogs] = useState([]);
  const [drawerOpen, setDrawerOpen] = useState(true);
  const [showAdd, setShowAdd] = useState(false);
  const [showExport, setShowExport] = useState(false);
  const [showTg, setShowTg] = useState(false);
  const [live, setLive] = useState(false);
  const [tgStatus, setTgStatus] = useState("off");
  const [tgNote, setTgNote] = useState("");
  const [tgChats, setTgChats] = useState([]);
  const [tgMsgs, setTgMsgs] = useState([]);
  const [tgKey, setTgKey] = useState("");
  const [queue, setQueue] = useState([]);
  const offsetRef = useRef(null);
  const baseRef = useRef(false);
  const inflightRef = useRef(false);

  const runRef = useRef(0);
  const speedRef = useRef(1);
  const nodesRef = useRef(nodes);
  const edgesRef = useRef(edges);
  const logEndRef = useRef(null);
  speedRef.current = speed;
  nodesRef.current = nodes;
  edgesRef.current = edges;

  useEffect(() => { if (logEndRef.current) logEndRef.current.scrollTop = logEndRef.current.scrollHeight; }, [logs, drawerOpen]);

  useEffect(() => {
    try { const k = sessionStorage.getItem("studio-key"); if (k) setTgKey(k); } catch (e) { /* bỏ qua */ }
  }, []);

  /* Polling Telegram thật qua /api/telegram */
  useEffect(() => {
    if (!live) { offsetRef.current = null; baseRef.current = false; setTgStatus(st => (st === "error" ? st : "off")); return; }
    let stop = false;
    setTgStatus("connecting");
    const headers = tgKey ? { "x-studio-key": tgKey } : {};
    const tick = async () => {
      if (inflightRef.current) return;
      inflightRef.current = true;
      try {
        const url = "/api/telegram" + (offsetRef.current != null ? "?offset=" + offsetRef.current : "");
        const r = await fetch(url, { headers });
        const ct = r.headers.get("content-type") || "";
        if (!ct.includes("json")) throw new Error("Không tìm thấy /api/telegram. Tính năng này chỉ chạy khi deploy trên Vercel.");
        const j = await r.json();
        if (stop) return;
        if (r.status === 401) { setTgStatus("error"); setTgNote("Sai hoặc thiếu Studio Key."); setLive(false); return; }
        if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
        if (!j.configured) { setTgStatus("error"); setTgNote("Chưa đặt biến môi trường TELEGRAM_BOT_TOKEN trên Vercel."); setLive(false); return; }
        if (j.needsChatId) { setTgStatus("setup"); setTgChats(j.chats || []); setTgNote("Chưa đặt TELEGRAM_CHAT_ID."); return; }
        setTgStatus("live"); setTgNote("");
        if (!baseRef.current) { baseRef.current = true; if (j.next != null) offsetRef.current = j.next; return; }
        if (j.next != null) offsetRef.current = j.next;
        if (j.updates && j.updates.length) {
          setTgMsgs(m => [...j.updates.map(u => ({ ...u, at: Date.now() })), ...m].slice(0, 8));
          setQueue(q => [...q, ...j.updates]);
        }
      } catch (e) {
        if (!stop) { setTgStatus("error"); setTgNote(e.message || "Lỗi kết nối"); setLive(false); }
      } finally { inflightRef.current = false; }
    };
    tick();
    const t = setInterval(tick, 3000);
    return () => { stop = true; clearInterval(t); };
  }, [live, tgKey]);

  /* Chạy luồng Telegram → Gemini → Claude với agent thật (gọi /api/agent) */
  const runLive = (text, send, key) => {
    const hdr = { "content-type": "application/json", ...(key ? { "x-studio-key": key } : {}) };
    const ctx = {};
    const callAgent = async (agent, prompt) => {
      const node = nodesRef.current.find(n => n.id === agent);
      const r = await fetch("/api/agent", { method: "POST", headers: hdr, body: JSON.stringify({ agent, system: node ? node.prompt : "", prompt }) });
      const ct = r.headers.get("content-type") || "";
      if (!ct.includes("json")) throw new Error("Không tìm thấy /api/agent (chỉ chạy khi deploy trên Vercel).");
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || "HTTP " + r.status);
      return j.text;
    };
    setScenarioId("telegram-agents");
    return runSim("telegram-agents", {
      userText: text,
      exec: {
        gemini: async () => {
          ctx.notes = await callAgent("gemini", "Yêu cầu của người dùng: " + text + "\n\nHãy nghiên cứu và tóm tắt các điểm cần thiết, ngắn gọn, dạng gạch đầu dòng.");
          return ctx.notes;
        },
        claude: async () => {
          ctx.answer = await callAgent("claude", "Yêu cầu của người dùng: " + text + "\n\nGhi chú nghiên cứu từ Gemini:\n" + (ctx.notes || "(không có)") + "\n\nHãy trả lời người dùng bằng tiếng Việt, ngắn gọn, phù hợp một tin nhắn Telegram.");
          return ctx.answer;
        },
      },
      onReply: async log => {
        if (!send) { log("sys", "ℹ Chạy thử: không gửi tin sang Telegram."); return; }
        const reply = (ctx.answer || "Đã nhận: «" + text.slice(0, 200) + "»\n\n(Chưa gọi được agent thật, xem Execution Trace để biết lý do.)").slice(0, 3500);
        try {
          const r = await fetch("/api/telegram", { method: "POST", headers: hdr, body: JSON.stringify({ text: reply }) });
          const j = await r.json().catch(() => ({}));
          if (r.ok && j.ok) log("done", "✉ Đã gửi phản hồi tới Telegram thật", "telegram");
          else log("sys", "⚠ Gửi Telegram thất bại: " + (j.error || r.status));
        } catch (e) { log("sys", "⚠ Gửi Telegram thất bại: " + e.message); }
      },
    });
  };

  /* Mỗi tin nhắn Telegram mới → chạy luồng agent thật */
  useEffect(() => {
    if (!live || running || queue.length === 0) return;
    const [m, ...rest] = queue;
    setQueue(rest);
    runLive(m.text.slice(0, 500), true, tgKey);
  }, [live, running, queue]);

  const scenario = SCENARIOS.find(s => s.id === scenarioId);
  const selectedNode = nodes.find(n => n.id === selected) || null;
  const nodeById = useMemo(() => Object.fromEntries(nodes.map(n => [n.id, n])), [nodes]);

  const updateNode = (id, patch) => setNodes(ns => ns.map(n => (n.id === id ? { ...n, ...patch } : n)));
  const addEdge = (from, to, label) => setEdges(es => [...es, { id: "e" + Date.now().toString(36) + es.length, from, to, label }]);
  const removeEdge = id => setEdges(es => es.filter(e => e.id !== id));
  const deleteNode = id => {
    setNodes(ns => ns.filter(n => n.id !== id));
    setEdges(es => es.filter(e => e.from !== id && e.to !== id));
    setSelected(null);
  };

  const createAgent = f => {
    const id = "n" + Date.now().toString(36);
    const k = nodes.length % 5;
    const node = {
      id, name: f.name.trim(), icon: "bot", color: f.color,
      x: 340 + k * 60, y: 600 + k * 20,
      role: f.role.trim() || "Agent tùy chỉnh.", model: f.model.trim() || "Custom",
      tools: [], prompt: "", input: "{ input: string }", output: "{ output: string }",
    };
    setNodes(ns => [...ns, node]);
    setEdges(es => {
      const add = [];
      if (f.from) add.push({ id: "e" + id + "a", from: f.from, to: id, label: "Handoff" });
      if (f.to) add.push({ id: "e" + id + "b", from: id, to: f.to, label: "Output" });
      return [...es, ...add];
    });
    setSelected(id);
    setShowAdd(false);
  };

  /* Kéo thả node */
  const startDrag = (e, id) => {
    if (e.button !== 0) return;
    const n = nodesRef.current.find(m => m.id === id);
    if (!n) return;
    const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y;
    setSelected(id);
    const move = ev => {
      const nx = Math.max(0, ox + ev.clientX - sx);
      const ny = Math.max(0, oy + ev.clientY - sy);
      setNodes(ns => ns.map(m => (m.id === id ? { ...m, x: nx, y: ny } : m)));
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  };

  /* Mô phỏng */
  const resetSim = () => {
    runRef.current++;
    setRunning(false);
    setStatuses({});
    setEdgeStates({});
    setLogs([]);
  };

  const runSim = async (scId, opts) => {
    if (running) return;
    const sc0 = SCENARIOS.find(s => s.id === (scId || scenarioId));
    const sc = opts && opts.userText
      ? { ...sc0, steps: sc0.steps.map((st, i) => (i === 0 ? { ...st, msg: "Nhắn cho bot Telegram: «" + opts.userText.slice(0, 120) + "»" } : st)) }
      : sc0;
    const myId = ++runRef.current;
    const alive = () => runRef.current === myId;
    const sleep = ms => new Promise(r => setTimeout(r, ms / speedRef.current));
    const t0 = Date.now();
    let seq = 0;
    const log = (level, text, nodeId) =>
      setLogs(l => [...l, { id: myId + "-" + seq++, at: ((Date.now() - t0) / 1000).toFixed(1), level, text, nodeId }]);

    setStatuses({});
    setEdgeStates({});
    setLogs([]);
    setRunning(true);
    setDrawerOpen(true);
    log("sys", "▶ Bắt đầu mô phỏng: " + sc.name);

    for (const step of sc.steps) {
      if (!alive()) return;
      const node = nodesRef.current.find(n => n.id === step.node);
      if (!node) { log("sys", "⚠ Bỏ qua bước: node «" + step.node + "» không còn tồn tại."); continue; }
      if (step.via) {
        const edge = edgesRef.current.find(e => e.id === step.via);
        if (edge) {
          const from = nodesRef.current.find(n => n.id === edge.from);
          log("handoff", `Handoff: ${from ? from.name : "?"} → ${node.name}  ·  ${edge.label}`, edge.from);
          setEdgeStates(s => ({ ...s, [edge.id]: "active" }));
          await sleep(850);
          if (!alive()) return;
          setEdgeStates(s => ({ ...s, [edge.id]: "done" }));
        } else {
          log("sys", "⚠ Đường nối đã bị xóa, chuyển tiếp trực tiếp.");
        }
      }
      setStatuses(s => ({ ...s, [node.id]: "thinking" }));
      log("info", step.msg, node.id);
      if (opts && opts.exec && opts.exec[node.id]) {
        try {
          const out = await opts.exec[node.id]();
          if (!alive()) return;
          const flat = String(out).replace(/\s+/g, " ");
          log("info", "↳ " + flat.slice(0, 320) + (flat.length > 320 ? "…" : ""), node.id);
        } catch (e) {
          if (!alive()) return;
          log("sys", "⚠ " + node.name + " lỗi: " + (e.message || e));
        }
      } else {
        await sleep(step.ms);
      }
      if (!alive()) return;
      if (opts && opts.onReply && step.via === "e16") await opts.onReply(log);
      if (!alive()) return;
      setStatuses(s => ({ ...s, [node.id]: "done" }));
      log("done", "✓ " + node.name + " hoàn tất", node.id);
    }
    if (!alive()) return;
    log("sys", "■ Mô phỏng kết thúc sau " + ((Date.now() - t0) / 1000).toFixed(1) + "s");
    setRunning(false);
  };

  /* Kích thước world */
  const worldW = Math.max(1280, ...nodes.map(n => n.x + W + 120));
  const worldH = Math.max(760, ...nodes.map(n => n.y + H + 120));

  /* Render edges */
  const edgeEls = edges.map(e => {
    const a = nodeById[e.from], b = nodeById[e.to];
    if (!a || !b) return null;
    const reciprocal = edges.some(o => o.from === e.to && o.to === e.from);
    const g = edgeGeom(a, b, reciprocal ? 15 : 0);
    const st = edgeStates[e.id] || "idle";
    const color = a.color;
    const ex = g.x2 - g.ux * 9, ey = g.y2 - g.uy * 9;
    const px = -g.uy, py = g.ux;
    const head = `${g.x2},${g.y2} ${ex + px * 5},${ey + py * 5} ${ex - px * 5},${ey - py * 5}`;
    const mx = (g.x1 + g.x2) / 2, my = (g.y1 + g.y2) / 2;
    const stroke = st === "idle" ? "#475569" : color;
    return (
      <g key={e.id} opacity={st === "idle" ? 0.75 : 1}>
        {st === "active" && <line x1={g.x1} y1={g.y1} x2={ex} y2={ey} stroke={color} strokeWidth="8" opacity="0.18" strokeLinecap="round" />}
        <line x1={g.x1} y1={g.y1} x2={ex} y2={ey} stroke={stroke} strokeWidth={st === "idle" ? 1.5 : 2.2}
          strokeDasharray="6 6" strokeLinecap="round" className={st === "active" ? "edge-flow-fast" : "edge-flow"} />
        <polygon points={head} fill={stroke} />
        {st === "active" && (
          <circle r="5" fill={color}>
            <animateMotion dur="0.85s" repeatCount="indefinite" path={`M${g.x1},${g.y1} L${g.x2},${g.y2}`} />
          </circle>
        )}
        <text x={mx} y={my - 5} textAnchor="middle" fontSize="10.5" fill={st === "idle" ? "#64748b" : "#cbd5e1"}
          stroke="#020617" strokeWidth="4" paintOrder="stroke" style={{ pointerEvents: "none" }}>{e.label}</text>
      </g>
    );
  });

  const levelColor = { sys: "#64748b", handoff: "#38bdf8", info: "#e2e8f0", done: "#34d399" };

  return (
    <div className="flex h-full flex-col bg-slate-950 text-slate-200">
      {/* Top bar */}
      <header className="flex shrink-0 flex-wrap items-center gap-3 border-b border-slate-800 bg-slate-950/90 px-4 py-2.5">
        <div className="flex items-center gap-2.5">
          <div className="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-amber-500/30 to-indigo-500/30 border border-slate-700">
            <Icon name="flow" size={16} className="text-slate-100" />
          </div>
          <div className="leading-tight">
            <div className="text-sm font-semibold text-slate-100">Multi-Agent Studio</div>
            <div className="text-[11px] text-slate-500">Claude · Gemini · Shared Layer</div>
          </div>
        </div>

        <div className="mx-1 hidden h-6 w-px bg-slate-800 md:block" />

        <select value={scenarioId} onChange={e => { if (!running) { setScenarioId(e.target.value); resetSim(); } }} disabled={running}
          className="max-w-[260px] rounded-md border border-slate-800 bg-slate-900 px-2.5 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-slate-600 disabled:opacity-60">
          {SCENARIOS.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
        <select value={speed} onChange={e => setSpeed(Number(e.target.value))}
          className="rounded-md border border-slate-800 bg-slate-900 px-2 py-1.5 text-sm text-slate-300 focus:outline-none focus:border-slate-600" title="Tốc độ mô phỏng">
          <option value={0.5}>0.5×</option><option value={1}>1×</option><option value={2}>2×</option><option value={4}>4×</option>
        </select>
        <button onClick={() => runSim()} disabled={running}
          className="inline-flex items-center gap-1.5 rounded-md bg-emerald-500 px-3 py-1.5 text-sm font-medium text-slate-950 hover:bg-emerald-400 disabled:opacity-60">
          {running ? <span className="block h-3.5 w-3.5 rounded-full border-2 border-slate-950 border-t-transparent spin" /> : <Icon name="play" size={14} />}
          {running ? "Đang chạy…" : "Run Simulation"}
        </button>
        <button onClick={resetSim} className="inline-flex items-center gap-1.5 rounded-md border border-slate-800 bg-slate-900 px-3 py-1.5 text-sm text-slate-300 hover:border-slate-600">
          <Icon name="reset" size={14} />Reset
        </button>

        <div className="ml-auto flex items-center gap-2">
          <button onClick={() => setShowAdd(true)} className="inline-flex items-center gap-1.5 rounded-md border border-slate-700 bg-slate-800 px-3 py-1.5 text-sm text-slate-100 hover:bg-slate-700">
            <Icon name="plus" size={14} />Add Agent
          </button>
          <button onClick={() => setShowTg(true)} className="inline-flex items-center gap-1.5 rounded-md border border-slate-800 bg-slate-900 px-3 py-1.5 text-sm text-slate-300 hover:border-slate-600">
            <span className="h-2 w-2 rounded-full" style={{ background: tgStatus === "live" ? "#34d399" : tgStatus === "connecting" || tgStatus === "setup" ? "#f59e0b" : tgStatus === "error" ? "#fb7185" : "#475569" }} />
            <Icon name="send" size={14} />Telegram thật
          </button>
          <button onClick={() => setShowExport(true)} className="inline-flex items-center gap-1.5 rounded-md border border-slate-800 bg-slate-900 px-3 py-1.5 text-sm text-slate-300 hover:border-slate-600">
            <Icon name="copy" size={14} />Export
          </button>
        </div>
      </header>

      {/* Main */}
      <div className="flex min-h-0 flex-1">
        <div className="relative min-w-0 flex-1 overflow-auto scroll-thin">
          <div className="absolute left-3 top-3 z-10 max-w-md rounded-lg border border-slate-800 bg-slate-900/80 px-3 py-2 text-[11px] text-slate-400 backdrop-blur" style={{ position: "sticky", float: "left" }}>
            <span className="font-medium text-slate-300">{scenario.name}</span><br />{scenario.desc}
          </div>
          <div
            className="relative"
            style={{
              width: worldW, height: worldH,
              backgroundImage: "radial-gradient(#1e293b 1px, transparent 1px)", backgroundSize: "22px 22px",
            }}
            onPointerDown={e => { if (e.target === e.currentTarget || e.target.tagName === "svg") setSelected(null); }}
          >
            <svg width={worldW} height={worldH} className="absolute left-0 top-0" style={{ pointerEvents: "none" }}>{edgeEls}</svg>
            {nodes.map(n => (
              <NodeCard key={n.id} node={n} status={statuses[n.id] || "idle"} selected={selected === n.id} onPointerDown={e => startDrag(e, n.id)} />
            ))}
          </div>
        </div>

        {/* Inspector */}
        <aside className="hidden w-[340px] shrink-0 overflow-auto border-l border-slate-800 bg-slate-900/50 scroll-thin md:block">
          <div className="sticky top-0 z-10 flex items-center gap-2 border-b border-slate-800 bg-slate-900/95 px-4 py-2.5 text-xs font-medium uppercase tracking-wider text-slate-400 backdrop-blur">
            <Icon name="cpu" size={13} />Inspector
          </div>
          {selectedNode ? (
            <Inspector key={selectedNode.id} node={selectedNode} nodes={nodes} edges={edges} status={statuses[selectedNode.id] || "idle"}
              onUpdate={updateNode} onDelete={deleteNode} onAddEdge={addEdge} onRemoveEdge={removeEdge} />
          ) : (
            <div className="space-y-4 p-4 text-sm text-slate-400">
              <p>Chọn một node trên sơ đồ để xem và chỉnh System Prompt, Model, Tools, Input/Output schema và các kết nối.</p>
              <div className="space-y-1.5">
                {nodes.map(n => (
                  <button key={n.id} onClick={() => setSelected(n.id)} className="flex w-full items-center gap-2 rounded-md border border-slate-800 bg-slate-950 px-2.5 py-2 text-left hover:border-slate-600">
                    <span className="h-2.5 w-2.5 rounded-full" style={{ background: n.color }} />
                    <span className="flex-1 truncate text-slate-200">{n.name}</span>
                    <span className="text-[10px] text-slate-600">{n.tools.length} tools</span>
                  </button>
                ))}
              </div>
              <div className="rounded-md border border-slate-800 p-3 text-[11px] leading-relaxed text-slate-500">
                <div className="mb-1 font-medium text-slate-400">Mẹo</div>
                Kéo thẻ để sắp xếp lại bố cục. Nét đứt chuyển động là chiều đi của dữ liệu; chấm sáng xuất hiện khi Handoff đang diễn ra.
              </div>
            </div>
          )}
        </aside>
      </div>

      {/* Bottom drawer */}
      <section className="shrink-0 border-t border-slate-800 bg-slate-950">
        <button onClick={() => setDrawerOpen(o => !o)} className="flex w-full items-center gap-2 px-4 py-2 text-xs font-medium uppercase tracking-wider text-slate-400 hover:text-slate-200">
          <Icon name="terminal" size={13} />Execution Trace
          <span className="rounded bg-slate-800 px-1.5 py-0.5 text-[10px] normal-case tracking-normal text-slate-400">{logs.length}</span>
          {running && <span className="ml-1 normal-case tracking-normal text-emerald-400">● đang chạy</span>}
          <span className="ml-auto"><Icon name={drawerOpen ? "down" : "up"} size={14} /></span>
        </button>
        {drawerOpen && (
          <div ref={logEndRef} className="h-44 overflow-auto border-t border-slate-900 bg-slate-950 px-4 py-2 font-mono text-xs scroll-thin">
            {logs.length === 0 ? (
              <div className="py-4 text-slate-600">Chưa có log. Chọn kịch bản và bấm “Run Simulation” để xem luồng thực thi theo thời gian thực.</div>
            ) : logs.map(l => {
              const n = l.nodeId ? nodeById[l.nodeId] : null;
              return (
                <div key={l.id} className="flex gap-3 py-0.5 leading-relaxed">
                  <span className="w-10 shrink-0 text-right text-slate-600">+{l.at}s</span>
                  {n ? <span className="w-36 shrink-0 truncate" style={{ color: n.color }}>{n.name}</span> : <span className="w-36 shrink-0 text-slate-700">system</span>}
                  <span style={{ color: levelColor[l.level] }}>{l.text}</span>
                </div>
              );
            })}
          </div>
        )}
      </section>

      {showAdd && <AddAgentModal nodes={nodes} onClose={() => setShowAdd(false)} onCreate={createAgent} />}
      {showTg && <TelegramModal status={tgStatus} note={tgNote} chats={tgChats} msgs={tgMsgs} live={live} setLive={setLive} tgKey={tgKey} setTgKey={setTgKey} running={running} onTest={(t, k) => runLive(t, false, k)} onClose={() => setShowTg(false)} />}
      {showExport && <ExportModal nodes={nodes} edges={edges} onClose={() => setShowExport(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
